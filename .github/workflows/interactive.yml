name: Interactive Profile

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
  issue_comment:
    types: [created]

permissions:
  contents: write

concurrency:
  group: interactive-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync latest
        run: git pull --rebase=merges origin main

      - name: Update guestbook + daily quote
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 .github/scripts/update_profile.py

      - name: Commit changes
        run: |
          git config user.name "profile-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet; then
            git commit -am ":sparkles: profile refresh [skip ci]"
          fi
          # retry: render3d pushes to main in parallel, so a push can be
          # rejected as non-fast-forward — rebase onto latest and retry
          for i in 1 2 3 4 5; do
            if git pull --rebase=merges origin main && git push; then
              echo "push ok (attempt $i)"
              exit 0
            fi
            sleep 3
          done
          echo "push failed after 5 attempts"
          exit 1

  render3d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit 3D graph
        run: |
          git config user.name "profile-bot"
          git config user.email "actions@users.noreply.github.com"
          git add profile-3d-contrib
          if ! git diff --cached --quiet; then
            git commit -m ":cuberoot: 3d graph refresh [skip ci]"
          fi
          # retry: refresh pushes to main in parallel, so a push can be
          # rejected as non-fast-forward — rebase onto latest and retry
          for i in 1 2 3 4 5; do
            if git pull --rebase=merges origin main && git push; then
              echo "push ok (attempt $i)"
              exit 0
            fi
            sleep 3
          done
          echo "push failed after 5 attempts"
          exit 1
