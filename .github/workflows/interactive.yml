name: Interactive Profile

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update guestbook + daily quote
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 .github/scripts/update_profile.py

      - name: Commit changes
        run: |
          git config user.name "profile-bot"
          git config user.email "actions@users.noreply.github.com"
          git diff --quiet || (git commit -am ":sparkles: profile refresh [skip ci]" && git push)

  render3d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit 3D graph
        run: |
          git config user.name "profile-bot"
          git config user.email "actions@users.noreply.github.com"
          git add profile-3d-contrib
          git diff --cached --quiet || (git commit -m ":cuberoot: 3d graph refresh [skip ci]" && git push)
