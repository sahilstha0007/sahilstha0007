name: Interactive Profile

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: read

concurrency:
  group: interactive-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest
        run: git pull --rebase=merges origin main

      - name: Update guestbook and daily quote
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 .github/scripts/update_profile.py

      - name: Load signing key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_SIGNING_KEY }}

      - name: Commit changes
        run: |
          git config user.name "profile-bot"
          git config user.email "146646189+sahilstha0007@users.noreply.github.com"
          git config gpg.format ssh
          read -r signing_key_type signing_key _ <<< "$(ssh-add -L)"
          git config user.signingkey "key::${signing_key_type} ${signing_key}"
          git config commit.gpgsign true
          git add README.md
          if git diff --cached --quiet; then
            echo "README already up to date"
            exit 0
          fi
          git commit -m "chore: refresh profile content [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase=merges origin main && git push; then
              echo "push ok (attempt $attempt)"
              exit 0
            fi
            sleep 3
          done
          echo "push failed after 5 attempts"
          exit 1

  render3d:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Load signing key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_SIGNING_KEY }}
      - name: Commit 3D graph
        run: |
          git config user.name "profile-bot"
          git config user.email "146646189+sahilstha0007@users.noreply.github.com"
          git config gpg.format ssh
          read -r signing_key_type signing_key _ <<< "$(ssh-add -L)"
          git config user.signingkey "key::${signing_key_type} ${signing_key}"
          git config commit.gpgsign true
          git add profile-3d-contrib
          if git diff --cached --quiet; then
            echo "3D graph already up to date"
            exit 0
          fi
          git commit -m "chore: refresh 3D contribution graph [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase=merges origin main && git push; then
              echo "push ok (attempt $attempt)"
              exit 0
            fi
            sleep 3
          done
          echo "push failed after 5 attempts"
          exit 1
