<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Live profile status panel</title>
  <desc id="desc">A terminal-style status panel showing 20 public repositories, 8 followers, 13 following and GitHub since 2023, with a pulsing activity trace.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111c"/>
      <stop offset="1" stop-color="#101b27"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#72f1bb"/>
      <stop offset="1" stop-color="#54d6e8" stop-opacity="0.35"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#7ca9ad" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <style>
      .led { transform-box: fill-box; transform-origin: center; animation: blink 1.8s steps(1, end) infinite; }
      .bar { transform-box: fill-box; transform-origin: bottom; animation: rise 2.4s ease-in-out infinite alternate; }
      .scan { transform-box: fill-box; transform-origin: center; animation: scan 7s linear infinite; }
      @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0.2; } }
      @keyframes rise { 0% { transform: scaleY(0.55); opacity: 0.55; } 100% { transform: scaleY(1); opacity: 1; } }
      @keyframes scan { 0% { transform: translateX(-40px); opacity: 0; } 15% { opacity: 0.5; } 85% { opacity: 0.5; } 100% { transform: translateX(1240px); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .led, .bar, .scan { animation: none !important; }
        .bar { opacity: 0.85 !important; }
      }
    </style>
  </defs>

  <rect width="1200" height="280" rx="12" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="12" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="278" rx="12" fill="none" stroke="#2b5961" stroke-width="2"/>
  <rect class="scan" x="0" y="1" width="2" height="278" fill="#72f1bb" opacity="0.35"/>

  <g font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace">
    <circle class="led" cx="34" cy="38" r="5" fill="#72f1bb"/>
    <text x="50" y="43" font-size="13" font-weight="700" fill="#72f1bb" letter-spacing="2">STATUS://PROFILE</text>
    <text x="1166" y="43" font-size="11" fill="#7ca9ad" text-anchor="end">KATHMANDU · UTC+05:45</text>
    <path d="M24 62H1176" stroke="#2b5961" stroke-width="1.5"/>

    <!-- metric tiles -->
    <g>
      <rect x="24" y="82" width="270" height="94" rx="10" fill="#0b1622" stroke="#2b5961"/>
      <text x="44" y="108" font-size="11" fill="#7ca9ad" letter-spacing="1.5">PUBLIC REPOS</text>
      <text x="44" y="150" font-size="38" font-weight="700" fill="#f2f7f7">20</text>
      <text x="118" y="149" font-size="11" fill="#54d6e8">▲ active</text>
    </g>
    <g>
      <rect x="316" y="82" width="270" height="94" rx="10" fill="#0b1622" stroke="#72f1bb" stroke-width="1.5"/>
      <text x="336" y="108" font-size="11" fill="#72f1bb" letter-spacing="1.5">FOLLOWERS</text>
      <text x="336" y="150" font-size="38" font-weight="700" fill="#72f1bb">8</text>
      <text x="380" y="149" font-size="11" fill="#54d6e8">● community</text>
    </g>
    <g>
      <rect x="608" y="82" width="270" height="94" rx="10" fill="#0b1622" stroke="#2b5961"/>
      <text x="628" y="108" font-size="11" fill="#7ca9ad" letter-spacing="1.5">FOLLOWING</text>
      <text x="628" y="150" font-size="38" font-weight="700" fill="#f2f7f7">13</text>
      <text x="682" y="149" font-size="11" fill="#f6b86b">● curious</text>
    </g>
    <g>
      <rect x="900" y="82" width="276" height="94" rx="10" fill="#0b1622" stroke="#2b5961"/>
      <text x="920" y="108" font-size="11" fill="#7ca9ad" letter-spacing="1.5">GITHUB SINCE</text>
      <text x="920" y="150" font-size="38" font-weight="700" fill="#f2f7f7">2023</text>
      <text x="1024" y="149" font-size="11" fill="#54d6e8">● shipping</text>
    </g>

    <!-- activity trace -->
    <text x="24" y="212" font-size="11" fill="#7ca9ad" letter-spacing="1">ACTIVITY TRACE</text>
    <path d="M24 262H1176" stroke="#2b5961" stroke-width="1"/>
    <g fill="url(#bar)">
      <rect class="bar" x="150" y="214" width="14" height="48" rx="2" style="animation-delay:0.0s"/>
      <rect class="bar" x="176" y="222" width="14" height="40" rx="2" style="animation-delay:0.1s"/>
      <rect class="bar" x="202" y="206" width="14" height="56" rx="2" style="animation-delay:0.2s"/>
      <rect class="bar" x="228" y="230" width="14" height="32" rx="2" style="animation-delay:0.3s"/>
      <rect class="bar" x="254" y="218" width="14" height="44" rx="2" style="animation-delay:0.4s"/>
      <rect class="bar" x="280" y="198" width="14" height="64" rx="2" style="animation-delay:0.5s"/>
      <rect class="bar" x="306" y="226" width="14" height="36" rx="2" style="animation-delay:0.6s"/>
      <rect class="bar" x="332" y="210" width="14" height="52" rx="2" style="animation-delay:0.7s"/>
      <rect class="bar" x="358" y="234" width="14" height="28" rx="2" style="animation-delay:0.8s"/>
      <rect class="bar" x="384" y="216" width="14" height="46" rx="2" style="animation-delay:0.9s"/>
      <rect class="bar" x="410" y="202" width="14" height="60" rx="2" style="animation-delay:1.0s"/>
      <rect class="bar" x="436" y="224" width="14" height="38" rx="2" style="animation-delay:1.1s"/>
      <rect class="bar" x="462" y="212" width="14" height="50" rx="2" style="animation-delay:1.2s"/>
      <rect class="bar" x="488" y="238" width="14" height="24" rx="2" style="animation-delay:1.3s"/>
      <rect class="bar" x="514" y="220" width="14" height="42" rx="2" style="animation-delay:1.4s"/>
      <rect class="bar" x="540" y="204" width="14" height="58" rx="2" style="animation-delay:1.5s"/>
      <rect class="bar" x="566" y="228" width="14" height="34" rx="2" style="animation-delay:1.6s"/>
      <rect class="bar" x="592" y="214" width="14" height="48" rx="2" style="animation-delay:1.7s"/>
      <rect class="bar" x="618" y="200" width="14" height="62" rx="2" style="animation-delay:1.8s"/>
      <rect class="bar" x="644" y="232" width="14" height="30" rx="2" style="animation-delay:1.9s"/>
      <rect class="bar" x="670" y="218" width="14" height="44" rx="2" style="animation-delay:2.0s"/>
      <rect class="bar" x="696" y="208" width="14" height="54" rx="2" style="animation-delay:2.1s"/>
      <rect class="bar" x="722" y="226" width="14" height="36" rx="2" style="animation-delay:2.2s"/>
      <rect class="bar" x="748" y="214" width="14" height="48" rx="2" style="animation-delay:2.3s"/>
      <rect class="bar" x="774" y="236" width="14" height="26" rx="2" style="animation-delay:2.4s"/>
      <rect class="bar" x="800" y="220" width="14" height="42" rx="2" style="animation-delay:2.5s"/>
      <rect class="bar" x="826" y="206" width="14" height="56" rx="2" style="animation-delay:2.6s"/>
      <rect class="bar" x="852" y="228" width="14" height="34" rx="2" style="animation-delay:2.7s"/>
      <rect class="bar" x="878" y="216" width="14" height="46" rx="2" style="animation-delay:2.8s"/>
      <rect class="bar" x="904" y="230" width="14" height="32" rx="2" style="animation-delay:2.9s"/>
      <rect class="bar" x="930" y="212" width="14" height="50" rx="2" style="animation-delay:3.0s"/>
      <rect class="bar" x="956" y="202" width="14" height="60" rx="2" style="animation-delay:3.1s"/>
      <rect class="bar" x="982" y="224" width="14" height="38" rx="2" style="animation-delay:3.2s"/>
      <rect class="bar" x="1008" y="218" width="14" height="44" rx="2" style="animation-delay:3.3s"/>
      <rect class="bar" x="1034" y="234" width="14" height="28" rx="2" style="animation-delay:3.4s"/>
      <rect class="bar" x="1060" y="216" width="14" height="46" rx="2" style="animation-delay:3.5s"/>
      <rect class="bar" x="1086" y="208" width="14" height="54" rx="2" style="animation-delay:3.6s"/>
      <rect class="bar" x="1112" y="226" width="14" height="36" rx="2" style="animation-delay:3.7s"/>
      <rect class="bar" x="1138" y="220" width="14" height="42" rx="2" style="animation-delay:3.8s"/>
    </g>
  </g>
</svg>
