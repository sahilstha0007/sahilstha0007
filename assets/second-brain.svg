<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">A wiki that maintains itself</title>
  <desc id="desc">Three layers: immutable raw sources feed an LLM-maintained wiki, governed by a schema rulebook. Signals travel between the layers while ingest, query and lint keep it current.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111c"/>
      <stop offset="0.55" stop-color="#0b1724"/>
      <stop offset="1" stop-color="#101b27"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#72f1bb"/>
      <stop offset="0.55" stop-color="#54d6e8"/>
      <stop offset="1" stop-color="#f6b86b"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="8%" r="70%">
      <stop offset="0" stop-color="#1a806e" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#1a806e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7ca9ad" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7ca9ad"/>
    </marker>
    <style>
      .wire-a, .wire-b { transform-box: fill-box; transform-origin: center; animation: wire 2.8s ease-in-out infinite; }
      .wire-b { animation-delay: 1.4s; }
      .ring { transform-box: fill-box; transform-origin: center; animation: breathe 3.6s ease-in-out infinite; }
      .live { transform-box: fill-box; transform-origin: center; animation: blink 2s steps(1, end) infinite; }
      .sweep { transform-box: fill-box; transform-origin: center; animation: drift 9s linear infinite; }
      @keyframes wire { 0% { opacity: 0; transform: translateX(-8px); } 35% { opacity: 1; } 65% { opacity: 1; } 100% { opacity: 0; transform: translateX(8px); } }
      @keyframes breathe { 0%, 100% { opacity: 0.28; transform: scale(1); } 50% { opacity: 0.7; transform: scale(1.015); } }
      @keyframes blink { 0%, 60% { opacity: 1; } 61%, 100% { opacity: 0.25; } }
      @keyframes drift { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.6; } }
      @media (prefers-reduced-motion: reduce) {
        .wire-a, .wire-b, .ring, .live, .sweep { animation: none !important; }
        .wire-a, .wire-b, .ring, .sweep { opacity: 0.55 !important; }
      }
    </style>
  </defs>

  <rect width="1200" height="380" rx="12" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="12" fill="url(#grid)"/>
  <rect class="sweep" width="1200" height="380" rx="12" fill="url(#glow)"/>
  <path d="M0 18H1200M0 362H1200" fill="none" stroke="#72f1bb" stroke-opacity="0.16"/>

  <g font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace">
    <circle class="live" cx="44" cy="44" r="5" fill="#72f1bb"/>
    <text x="60" y="49" fill="#72f1bb" font-size="13" letter-spacing="2.5">SECOND_BRAIN://PATTERN</text>
    <text x="40" y="82" fill="#f2f7f7" font-size="24" font-weight="700">A wiki that maintains itself</text>
    <text x="40" y="106" fill="#a7c2c3" font-size="12">knowledge is compiled once and kept current — not re-derived on every question</text>

    <!-- Layer 1 -->
    <rect x="40" y="130" width="320" height="84" rx="10" fill="#0b1622" stroke="#33555c" stroke-width="1.5"/>
    <text x="60" y="158" font-size="13" font-weight="700" fill="#a7c2c3" letter-spacing="1">01 / RAW SOURCES</text>
    <text x="60" y="181" font-size="12" fill="#d7e5e5">chat exports · project docs</text>
    <text x="60" y="199" font-size="12" fill="#d7e5e5">web research · assignments</text>

    <!-- Layer 2 with breathing ring -->
    <rect class="ring" x="432" y="122" width="336" height="100" rx="14" fill="none" stroke="#72f1bb" stroke-width="1"/>
    <rect x="440" y="130" width="320" height="84" rx="10" fill="#0b1622" stroke="#72f1bb" stroke-width="2"/>
    <text x="460" y="158" font-size="13" font-weight="700" fill="#72f1bb" letter-spacing="1">02 / THE WIKI</text>
    <text x="460" y="181" font-size="12" fill="#d7e5e5">entities · concepts · sources</text>
    <text x="460" y="199" font-size="12" fill="#d7e5e5">comparisons · synthesis · answers</text>

    <!-- Layer 3 -->
    <rect x="840" y="130" width="320" height="84" rx="10" fill="#0b1622" stroke="#54d6e8" stroke-width="1.5"/>
    <text x="860" y="158" font-size="13" font-weight="700" fill="#54d6e8" letter-spacing="1">03 / THE SCHEMA</text>
    <text x="860" y="181" font-size="12" fill="#d7e5e5">AGENTS.md / CLAUDE.md</text>
    <text x="860" y="199" font-size="12" fill="#d7e5e5">the rulebook that keeps it honest</text>

    <!-- connectors + travelling signals -->
    <line x1="365" y1="172" x2="432" y2="172" stroke="#7ca9ad" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="765" y1="172" x2="832" y2="172" stroke="#7ca9ad" stroke-width="2" marker-end="url(#arrow)"/>
    <g class="wire-a"><circle cx="398" cy="172" r="4" fill="#72f1bb"/></g>
    <g class="wire-b"><circle cx="798" cy="172" r="4" fill="#f6b86b"/></g>

    <!-- operations -->
    <text x="40" y="264" font-size="12" font-weight="700" fill="#f2f7f7" letter-spacing="1.5">THREE OPERATIONS</text>

    <rect x="40" y="278" width="350" height="56" rx="8" fill="#07111c" stroke="#2b5961"/>
    <text x="58" y="302" font-size="13" font-weight="700" fill="#72f1bb">INGEST</text>
    <text x="140" y="302" font-size="11" fill="#a7c2c3">source → summary → cross-link → log</text>
    <text x="58" y="321" font-size="10" fill="#5f8286">a new source updates every related page</text>

    <rect x="425" y="278" width="350" height="56" rx="8" fill="#07111c" stroke="#2b5961"/>
    <text x="443" y="302" font-size="13" font-weight="700" fill="#54d6e8">QUERY</text>
    <text x="525" y="302" font-size="11" fill="#a7c2c3">index-first, cite, file answers back</text>
    <text x="443" y="321" font-size="10" fill="#5f8286">exploration compounds instead of evaporating</text>

    <rect x="810" y="278" width="350" height="56" rx="8" fill="#07111c" stroke="#2b5961"/>
    <text x="828" y="302" font-size="13" font-weight="700" fill="#f6b86b">LINT</text>
    <text x="892" y="302" font-size="11" fill="#a7c2c3">contradictions · stale claims · orphans</text>
    <text x="828" y="321" font-size="10" fill="#5f8286">health checks on a living knowledge base</text>

    <text x="40" y="356" font-size="11" fill="#7ca9ad">human curates and thinks · LLM does the bookkeeping · index.md + log.md keep it navigable</text>
  </g>
</svg>
