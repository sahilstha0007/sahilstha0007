<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-labelledby="title desc">
  <title id="title">The build loop</title>
  <desc id="desc">A four-stage loop: interface, API, infrastructure, feedback. Signals travel between each stage.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111c"/>
      <stop offset="1" stop-color="#101b27"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#7ca9ad" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7ca9ad"/>
    </marker>
    <style>
      .led { transform-box: fill-box; transform-origin: center; animation: blink 2s steps(1, end) infinite; }
      .p1, .p2, .p3 { transform-box: fill-box; transform-origin: center; animation: travel 2.2s ease-in-out infinite; }
      .p2 { animation-delay: 0.7s; }
      .p3 { animation-delay: 1.4s; }
      @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0.2; } }
      @keyframes travel { 0% { opacity: 0; transform: translateX(-6px); } 40% { opacity: 1; } 60% { opacity: 1; } 100% { opacity: 0; transform: translateX(6px); } }
      @media (prefers-reduced-motion: reduce) {
        .led, .p1, .p2, .p3 { animation: none !important; }
        .p1, .p2, .p3 { opacity: 0.7 !important; }
      }
    </style>
  </defs>

  <rect width="1200" height="200" rx="12" fill="url(#bg)"/>
  <rect width="1200" height="200" rx="12" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="198" rx="12" fill="none" stroke="#2b5961" stroke-width="2"/>

  <g font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace">
    <circle class="led" cx="34" cy="32" r="4" fill="#72f1bb"/>
    <text x="48" y="37" font-size="11" font-weight="700" fill="#72f1bb" letter-spacing="2">SIGNAL://LOOP</text>
    <text x="1166" y="37" font-size="10" fill="#7ca9ad" text-anchor="end">THE LOOP I BUILD IN</text>

    <rect x="40" y="62" width="230" height="72" rx="10" fill="#0b1622" stroke="#72f1bb" stroke-width="1.5"/>
    <text x="155" y="106" font-size="22" font-weight="700" fill="#72f1bb" text-anchor="middle">interface</text>

    <rect x="340" y="62" width="170" height="72" rx="10" fill="#0b1622" stroke="#54d6e8" stroke-width="1.5"/>
    <text x="425" y="106" font-size="22" font-weight="700" fill="#54d6e8" text-anchor="middle">API</text>

    <rect x="580" y="62" width="300" height="72" rx="10" fill="#0b1622" stroke="#f6b86b" stroke-width="1.5"/>
    <text x="730" y="106" font-size="22" font-weight="700" fill="#f6b86b" text-anchor="middle">infrastructure</text>

    <rect x="950" y="62" width="210" height="72" rx="10" fill="#0b1622" stroke="#f2f7f7" stroke-width="1.5"/>
    <text x="1055" y="106" font-size="22" font-weight="700" fill="#f2f7f7" text-anchor="middle">feedback</text>

    <line x1="275" y1="98" x2="333" y2="98" stroke="#7ca9ad" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="515" y1="98" x2="573" y2="98" stroke="#7ca9ad" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="885" y1="98" x2="943" y2="98" stroke="#7ca9ad" stroke-width="2" marker-end="url(#arrow)"/>
    <g class="p1"><circle cx="304" cy="98" r="4" fill="#72f1bb"/></g>
    <g class="p2"><circle cx="544" cy="98" r="4" fill="#54d6e8"/></g>
    <g class="p3"><circle cx="914" cy="98" r="4" fill="#f6b86b"/></g>

    <text x="40" y="170" font-size="11" fill="#a7c2c3">ship the surface · wire the contract · run it somewhere real · measure · repeat</text>
  </g>
</svg>
